<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动力智能设计平台 · 内网协作中枢</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231A56A8'/%3E%3Cpath d='M9 22V10h5.2c3.6 0 6 2.4 6 6s-2.4 6-6 6H9z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div id="login" class="login-wrap hidden">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark">D</div>
      <div>
        <div class="login-title">动力智能设计平台</div>
        <div class="login-sub">内网协作中枢 · 离线自托管</div>
      </div>
    </div>
    <div class="login-users" id="loginUsers"></div>
    <form id="loginForm" autocomplete="off">
      <label class="field-label" for="loginPass">密码</label>
      <input class="input" id="loginPass" type="password" placeholder="输入密码">
      <div class="field-error" id="loginError"></div>
      <button class="btn btn-primary btn-block" type="submit">进入工作台</button>
    </form>
    <div class="login-hint">初始密码 dsh123456，正式部署后请按部署手册修改</div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="ws-head">
      <div class="brand-mark sm">D</div>
      <div class="ws-meta">
        <div class="ws-name">动力智能设计平台</div>
        <div class="ws-org">FDE 团队 · 内网</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-section" id="sideExtra"></div>
    <div class="side-foot">
      <div class="me-chip" id="meChip"></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <span class="provider-chip" id="providerChip" title="Agent 推理通道"></span>
        <button class="kbd-btn" id="cmdkBtn" title="快速切换 (Ctrl+K)">⌘K</button>
        <button class="icon-btn" id="logoutBtn" title="退出">退出</button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="cmdk-wrap hidden" id="cmdk">
  <div class="cmdk-box">
    <input class="cmdk-input" id="cmdkInput" placeholder="跳转到频道、模块、智能体、文档…">
    <div class="cmdk-list" id="cmdkList"></div>
    <div class="cmdk-foot">Enter 打开 · Esc 关闭</div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="/assets/app.js"></script>
</body>
</html>
